services:
  db:
    image: postgres:16-alpine
    # t3.small(2 GiB)에서 앱·OS와 공존하도록 DB의 최대 메모리를 제한한다.
    mem_limit: 384m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-haemi}
      POSTGRES_USER: ${POSTGRES_USER:-haemi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?DB password required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-haemi}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ${DOCKER_IMAGE:-haemi/haemi-server:latest}
    # Java 힙은 Dockerfile의 MaxRAMPercentage(60%)에 따라 최대 약 540 MB가 된다.
    # 남은 메모리는 JVM 네이티브 영역, Docker, PostgreSQL, OS에 확보한다.
    mem_limit: 900m
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-haemi}
      DB_USERNAME: ${POSTGRES_USER:-haemi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?DB password required}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  pg_data:
