spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# 전체 API 표면이 인증 없이 공개된다. 클라이언트 개발 중이라 기본은 켜 두고,
# 정식 오픈 시점에 배포 설정만 바꿔서 끈다. (#100)
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

haemi:
  media:
    storage:
      bucket: ${S3_BUCKET}
      region: ${S3_REGION:ap-northeast-2}
      endpoint: ${S3_ENDPOINT:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style-access: ${S3_PATH_STYLE_ACCESS:false}
      presigned-put-expiry: ${S3_PRESIGNED_PUT_EXPIRY:PT15M}
      serving-url-expiry: ${S3_SERVING_URL_EXPIRY:PT1H}
  mail:
    from: ${MAIL_FROM}
    public-url: ${APP_PUBLIC_URL}
  openapi:
    include-local-server: false
  jwt:
    secret: ${JWT_SECRET}
