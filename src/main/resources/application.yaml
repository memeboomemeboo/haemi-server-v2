spring:
  application:
    name: haemi
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/haemi}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:haemi}
    password: ${DB_PASSWORD:haemi-local-password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}

logging:
  pattern:
    # RequestIdFilter가 MDC에 넣는 requestId를 모든 로그 라인에 포함 (응답 헤더 X-Request-Id와 대조용)
    level: "%5p [%X{requestId:-no-request-id}]"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

haemi:
  cors:
    allowed-origins: ${HAEMI_CORS_ALLOWED_ORIGINS:http://localhost:8100,http://127.0.0.1:8100}
  openapi:
    server-url: ${OPENAPI_SERVER_URL:}
    local-server-url: ${OPENAPI_LOCAL_SERVER_URL:http://localhost:8080}
    include-local-server: ${OPENAPI_INCLUDE_LOCAL_SERVER:true}
  family:
    max-elders: ${HAEMI_FAMILY_MAX_ELDERS:4}
    max-guardians: ${HAEMI_FAMILY_MAX_GUARDIANS:8}
  jwt:
    secret: ${JWT_SECRET:haemi-dev-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256!!}
    access-token-validity: PT30M
    refresh-token-validity: P14D
  internal:
    # local/test에서 수동 배치 트리거를 사용할 때만 환경 변수로 설정한다. 기본값은 비활성(fail-closed).
    manual-trigger-token: ${HAEMI_INTERNAL_MANUAL_TRIGGER_TOKEN:}
  mail:
    from: ${MAIL_FROM:no-reply@haemi.local}
    public-url: ${APP_PUBLIC_URL:http://localhost:8080}
  notification:
    elder-daily-limit: 3
    elder-quiet-hours-start: 21
    elder-quiet-hours-end: 8
    fcm:
      credentials: ${FIREBASE_CREDENTIALS:}
      project-id: ${FIREBASE_PROJECT_ID:}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      connect-timeout: ${GEMINI_CONNECT_TIMEOUT:5s}
      read-timeout: ${GEMINI_READ_TIMEOUT:20s}
      inline-audio-max-bytes: ${GEMINI_INLINE_AUDIO_MAX_BYTES:12582912}
      max-concurrent-audio-requests: ${GEMINI_MAX_CONCURRENT_AUDIO_REQUESTS:2}
    reminiscence:
      batch-enabled: ${HAEMI_AI_REMINISCENCE_BATCH_ENABLED:true}
  media:
    image:
      max-size-bytes: ${HAEMI_MEDIA_IMAGE_MAX_SIZE_BYTES:10485760}
      memory-max-count: ${HAEMI_MEDIA_IMAGE_MEMORY_MAX_COUNT:4}
      allowed-content-types: ${HAEMI_MEDIA_IMAGE_ALLOWED_TYPES:image/jpeg,image/png,image/webp,image/heic,image/heif}
    heic:
      enabled: ${HAEMI_MEDIA_HEIC_ENABLED:true}
      command: ${HAEMI_MEDIA_HEIC_COMMAND:heif-convert}
      timeout: ${HAEMI_MEDIA_HEIC_TIMEOUT:PT20S}
    voice:
      max-size-bytes: ${HAEMI_MEDIA_VOICE_MAX_SIZE_BYTES:12582912}
      max-duration-seconds: ${HAEMI_MEDIA_VOICE_MAX_DURATION_SECONDS:60}
      allowed-content-types: ${HAEMI_MEDIA_VOICE_ALLOWED_TYPES:audio/aac,audio/mp4,audio/webm,audio/ogg}
    profile:
      max-size-bytes: ${HAEMI_MEDIA_PROFILE_MAX_SIZE_BYTES:5242880}
      allowed-content-types: ${HAEMI_MEDIA_PROFILE_ALLOWED_TYPES:image/jpeg,image/png,image/webp}
    presigned-url:
      expiry: ${HAEMI_MEDIA_PRESIGNED_URL_EXPIRY:PT15M}
    retention:
      memory-days: ${HAEMI_MEDIA_RETENTION_MEMORY_DAYS:365}
      response-days: ${HAEMI_MEDIA_RETENTION_RESPONSE_DAYS:365}
  dailycare:
    retention-days: ${HAEMI_DAILYCARE_RETENTION_DAYS:30}
    inbox-look-back-days: ${HAEMI_DAILYCARE_INBOX_LOOKBACK_DAYS:30}
    max-voice-duration-seconds: ${HAEMI_DAILYCARE_MAX_VOICE_SECONDS:60}
  training:
    orientation-question-count: ${HAEMI_TRAINING_ORIENTATION_COUNT:3}
    recall-question-count: ${HAEMI_TRAINING_RECALL_COUNT:3}
    language-question-count: ${HAEMI_TRAINING_LANGUAGE_COUNT:2}
    delayed-recall-question-count: ${HAEMI_TRAINING_DELAYED_RECALL_COUNT:2}
    inactivity-reminder-seconds: ${HAEMI_TRAINING_INACTIVITY_REMINDER_SECONDS:90}
    promotion-accuracy: ${HAEMI_TRAINING_PROMOTION_ACCURACY:0.8}
    demotion-accuracy: ${HAEMI_TRAINING_DEMOTION_ACCURACY:0.4}
    promotion-consecutive-days: ${HAEMI_TRAINING_PROMOTION_DAYS:2}
  content:
    cooldown-days: ${HAEMI_CONTENT_COOLDOWN_DAYS:7}
    depletion-threshold: ${HAEMI_CONTENT_DEPLETION_THRESHOLD:20}
