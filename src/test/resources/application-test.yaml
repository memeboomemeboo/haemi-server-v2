spring:
  datasource:
    url: jdbc:h2:mem:haemi-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

haemi:
  ai:
    gemini:
      # 실제 Gemini 호출이 필요한 테스트는 별도 HTTP 서버를 사용한다.
      api-key:
