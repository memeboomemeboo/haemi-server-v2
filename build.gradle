plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.memeboo2'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.modulith:spring-modulith-bom:2.0.0'
		mavenBom 'software.amazon.awssdk:bom:2.33.13'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// Spring Modulith
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	implementation 'org.springframework.modulith:spring-modulith-events-jpa'
	implementation 'org.springframework.modulith:spring-modulith-events-jackson'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'

	// JWT (jjwt 0.12.x)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// FCM push notifications (Firebase Admin SDK)
	implementation 'com.google.firebase:firebase-admin:9.7.0'

	// AWS S3 (실 스토리지 어댑터 — presigned URL 발급/조회)
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:apache-client'

	// 인지 리포트 PDF (HTML→PDF, 한글 TTF 임베드)
	implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'

	// API docs
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	testRuntimeOnly 'com.h2database:h2'

	// ArchUnit
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
