name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR (skip tests — CI already ran them)
        run: ./gradlew bootJar --no-daemon -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/haemi-server:latest
            ${{ secrets.DOCKER_USERNAME }}/haemi-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare EC2 deployment directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            sudo install -d -o "$(id -un)" -g "$(id -gn)" /opt/haemi

      - name: Copy Docker Compose configuration
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: docker-compose.yml
          target: /opt/haemi

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          APP_PORT: ${{ secrets.APP_PORT }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          ELDER_HEALTH_ENCRYPTION_KEY: ${{ secrets.ELDER_HEALTH_ENCRYPTION_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          SPRING_PROFILES_ACTIVE: ${{ secrets.SPRING_PROFILES_ACTIVE }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          envs: APP_PORT,EC2_HOST,ELDER_HEALTH_ENCRYPTION_KEY,GEMINI_API_KEY,JWT_SECRET,MAIL_FROM,MAIL_HOST,MAIL_PASSWORD,MAIL_PORT,MAIL_USERNAME,POSTGRES_DB,POSTGRES_PASSWORD,POSTGRES_USER,SPRING_PROFILES_ACTIVE,DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            set -e
            cd /opt/haemi
            umask 077
            if [ -z "$APP_PORT" ]; then APP_PORT=8080; fi
            APP_PUBLIC_URL="http://${EC2_HOST}:${APP_PORT}"
            cat > .env <<EOF
            SPRING_PROFILES_ACTIVE=$SPRING_PROFILES_ACTIVE
            POSTGRES_DB=$POSTGRES_DB
            POSTGRES_USER=$POSTGRES_USER
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            APP_PORT=$APP_PORT
            DOCKER_IMAGE=$DOCKER_USERNAME/haemi-server:latest
            JWT_SECRET=$JWT_SECRET
            ELDER_HEALTH_ENCRYPTION_KEY=$ELDER_HEALTH_ENCRYPTION_KEY
            MAIL_HOST=$MAIL_HOST
            MAIL_PORT=$MAIL_PORT
            MAIL_USERNAME=$MAIL_USERNAME
            MAIL_PASSWORD=$MAIL_PASSWORD
            MAIL_FROM=$MAIL_FROM
            APP_PUBLIC_URL=$APP_PUBLIC_URL
            GEMINI_API_KEY=$GEMINI_API_KEY
            API_DOCS_ENABLED=true
            EOF
            # 디스크 부족(no space left on device) 방지: pull 전에 미사용 이미지/캐시 정리.
            # 실행 중 컨테이너(app·postgres)가 사용하는 이미지와 볼륨(DB 데이터)은 유지된다.
            docker image prune -af || true
            docker builder prune -af || true
            df -h / || true
            printf '%s' "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            docker compose pull app
            # 기존 컨테이너를 먼저 정리해 포트 충돌(5432 already allocated)을 방지한다.
            # 명명된 볼륨(DB 데이터)은 down으로 삭제되지 않으므로 데이터는 보존된다.
            docker compose down --remove-orphans || true
            docker compose up -d --no-build --wait --remove-orphans
            curl --fail --retry 12 --retry-connrefused --retry-delay 2 "http://127.0.0.1:${APP_PORT}/actuator/health"
            docker image prune -f
